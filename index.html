<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#eeedf5"><title>HALFTONE — 하프톤 스튜디오</title><style>
:root{--ink:#292344;--muted:#817b92;--line:#dedbe6;--purple:#71608d}*{box-sizing:border-box}body{margin:0;background:#f7f6fa;color:var(--ink);font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:13px}button,input,select{font:inherit}button{cursor:pointer;color:inherit}button:disabled{cursor:wait;opacity:.55}header{height:85px;margin:0 4vw;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.brand{font-size:26px;letter-spacing:-1px;font-weight:800}.brand span{font-size:9px;letter-spacing:2px;font-weight:500;display:block;margin-top:3px}.private{font-size:11px;color:var(--muted)}main{max-width:1510px;margin:auto;display:grid;grid-template-columns:300px 1fr;gap:45px;padding:32px 4vw 30px}.intro{font-size:25px;letter-spacing:-1px;line-height:1.35;margin:0 0 9px}.sub{font-size:12px;color:var(--muted);line-height:1.8;margin:0 0 25px}.upload{display:flex;align-items:center;justify-content:space-between;width:100%;padding:15px 17px;background:white;border:1px solid var(--line);border-radius:8px;text-align:left}.upload b{font-size:20px;font-weight:400}input[type=file]{display:none}section.settings{border-top:1px solid var(--line);margin-top:24px;padding-top:21px}.label{font-size:10px;letter-spacing:1.5px;color:var(--muted);display:flex;justify-content:space-between;margin-bottom:13px}.presets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.preset{border:1px solid var(--line);background:transparent;border-radius:7px;padding:9px 3px;font-size:10px}.preset.active{border-color:var(--purple);background:#eeebf3}.swatch{height:26px;width:26px;border-radius:50%;margin:0 auto 7px;background:radial-gradient(#33305f 1px,transparent 1.2px) 0 0/4px 4px,#e1dbf1}.mono{background:radial-gradient(#222 1px,transparent 1.2px) 0 0/4px 4px,#eee}.rose{background:radial-gradient(#642e50 1px,transparent 1.2px) 0 0/4px 4px,#f4dce7}.control{margin:18px 0}.row{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}.row output{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}input[type=range]{width:100%;height:4px;accent-color:var(--purple);cursor:pointer;display:block;margin:14px 0 22px}input[type=color]{width:34px;height:25px;border:none;background:none;padding:0;cursor:pointer}.color-row{display:flex;justify-content:space-between;align-items:center;margin:12px 0}select{border:1px solid var(--line);border-radius:5px;background:white;padding:6px;color:var(--ink)}.reset{border:0;background:none;font-size:11px;color:var(--muted);padding:0;text-decoration:underline;text-underline-offset:3px}.save{width:100%;border:0;border-radius:7px;background:var(--ink);color:white;padding:15px;margin-top:18px;display:flex;justify-content:space-between}.note{font-size:10px;line-height:1.7;color:var(--muted);margin:10px 0 0}.workspace{min-width:0}.toolbar{height:33px;display:flex;align-items:flex-start;justify-content:space-between;font-size:10px;color:var(--muted);letter-spacing:.5px}.compare{border:0;background:none;color:var(--ink);font-size:11px;padding:0 0 5px;touch-action:none;user-select:none}.stage{height:calc(100vh - 225px);min-height:440px;max-height:960px;background:#eeedf2;border:1px solid #e6e3ec;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:25px;position:relative;overflow:hidden}.stage.drag{outline:2px dashed var(--purple);outline-offset:-8px}.stage canvas{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;box-shadow:0 10px 35px #30234615;display:block}.stage .badge{position:absolute;left:15px;bottom:13px;font-size:9px;letter-spacing:1.5px;background:#f7f6fae6;padding:6px 9px;border-radius:4px;pointer-events:none}.under{display:flex;justify-content:space-between;padding-top:13px;font-size:10px;color:var(--muted)}#status{min-height:17px}.error{color:#a23c56!important}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #9e77c2;outline-offset:4px}@media(min-width:1400px){main{grid-template-columns:310px 1fr;gap:65px}}@media(max-width:760px){header{height:69px;margin:0 20px}.brand{font-size:23px}.private{font-size:9px}main{display:flex;flex-direction:column;padding:22px 20px;gap:24px}.workspace{order:-1}.stage{height:50vh;min-height:290px;padding:17px}.intro{font-size:23px}.sub{margin-bottom:16px}section.settings{margin-top:20px}.settings.tone{display:grid;grid-template-columns:1fr 1fr;column-gap:25px}.settings.tone>.label{grid-column:1/-1}.settings.tone .control{margin:6px 0}.save{margin-top:14px}.under{font-size:9px}.toolbar{height:27px}}
</style></head><body><header><div class="brand">HALFTONE<span>사진을 점으로, 분위기를 색으로.</span></div><span class="private">YOUR PHOTO, YOUR BROWSER.</span></header><main><aside><h1 class="intro">작은 점들이 만드는<br>다른 분위기.</h1><p class="sub">사진 한 장을 부드러운 망점 이미지로.<br>색감과 질감을 조절해 나만의 에딧을 만들어 봐.</p><button class="upload" id="upload">사진 불러오기 <b>＋</b></button><input id="file" type="file" accept="image/*"><section class="settings"><div class="label">01 / PRESET <span>분위기</span></div><div class="presets"><button class="preset active" data-preset="lavender"><div class="swatch"></div>라벤더</button><button class="preset" data-preset="mono"><div class="swatch mono"></div>흑백</button><button class="preset" data-preset="rose"><div class="swatch rose"></div>로즈</button></div></section><section class="settings"><div class="label">02 / DOTS <span>망점</span></div><div class="control"><label class="row" for="size">점 간격 <output id="sizeValue"></output></label><input type="range" id="size" min="3" max="20" step=".5" value="5"></div><div class="control"><label class="row" for="angle">각도 <output id="angleValue"></output></label><input type="range" id="angle" min="0" max="90" value="45"></div><div class="control"><label class="row" for="strength">망점 농도 <output id="strengthValue"></output></label><input type="range" id="strength" min="0" max="100" value="76"></div><label class="color-row" for="ink">점 색상 <input type="color" id="ink" value="#29235e"></label></section><section class="settings tone"><div class="label">03 / TONE <span>색감</span></div><div class="control"><label class="row" for="brightness">밝기 <output id="brightnessValue"></output></label><input type="range" id="brightness" min="-35" max="35" value="12"></div><div class="control"><label class="row" for="contrast">대비 <output id="contrastValue"></output></label><input type="range" id="contrast" min="-40" max="60" value="8"></div><div class="control"><label class="row" for="tint">색감 강도 <output id="tintValue"></output></label><input type="range" id="tint" min="0" max="100" value="55"></div></section><section class="settings"><div class="row"><button class="reset" id="reset">설정 초기화</button><label for="format"><select id="format" aria-label="저장 형식"><option value="png">PNG</option><option value="jpeg">JPG</option></select></label></div><button class="save" id="save"><span>이미지 저장</span><span>↓</span></button><p class="note">사진은 브라우저 안에서만 처리돼요.<br>저장 크기: 원본 기준, 긴 변 최대 4,096px.</p></section></aside><div class="workspace"><div class="toolbar"><span id="filename">SAMPLE / 샘플 이미지</span><button id="compare" class="compare">누르는 동안 원본 보기 ↗</button></div><div class="stage" id="stage"><canvas id="canvas" aria-label="하프톤 이미지 미리보기"></canvas><div class="badge" id="badge">LIVE PREVIEW</div></div><div class="under"><span id="status" role="status" aria-live="polite">사진을 올리거나 이곳에 끌어다 놓으세요.</span><span id="dimensions"></span></div></div></main><script>
'use strict';
const $=id=>document.getElementById(id),canvas=$('canvas'),ctx=canvas.getContext('2d');
const ids=['size','angle','strength','brightness','contrast','tint'];
const defaults={size:5,angle:45,strength:76,brightness:12,contrast:8,tint:55};
const presets={lavender:{ink:'#29235e',paper:[241,240,255]},mono:{ink:'#242424',paper:[250,249,247]},rose:{ink:'#642c50',paper:[255,235,244]}};
let preset='lavender',source=null,sample=true,fileName='halftone',timer,comparing=false,uploadVersion=0;
function values(){return Object.fromEntries(ids.map(id=>[id,Number($(id).value)]));}
function labels(){for(const id of ids)$(id+'Value').textContent=$(id).value+(id==='angle'?'°':id==='size'?' px':id==='strength'||id==='tint'?'%':'');}
function message(s,error=false){$('status').textContent=s;$('status').classList.toggle('error',error);}
function sampleImage(){const c=document.createElement('canvas');c.width=1000;c.height=1250;const x=c.getContext('2d');let g=x.createLinearGradient(0,0,900,1200);g.addColorStop(0,'#a4a2c5');g.addColorStop(.5,'#ead5dd');g.addColorStop(1,'#8f90b0');x.fillStyle=g;x.fillRect(0,0,c.width,c.height);x.save();x.translate(500,540);for(let i=0;i<9;i++){x.save();x.rotate(i*Math.PI*2/9);g=x.createRadialGradient(0,-170,10,0,-220,245);g.addColorStop(0,'#fff9ef');g.addColorStop(.55,'#e5b9c8');g.addColorStop(1,'#80759b');x.fillStyle=g;x.beginPath();x.ellipse(0,-170,117,230,0,0,Math.PI*2);x.fill();x.restore()}g=x.createRadialGradient(-20,-20,5,0,0,140);g.addColorStop(0,'#ecdbc4');g.addColorStop(1,'#6b5376');x.fillStyle=g;x.beginPath();x.arc(0,0,125,0,Math.PI*2);x.fill();x.restore();x.strokeStyle='#686d7a';x.lineWidth=17;x.beginPath();x.moveTo(500,740);x.bezierCurveTo(430,920,560,1020,430,1250);x.stroke();x.fillStyle='#89928d';x.beginPath();x.ellipse(592,1000,150,48,-.6,0,Math.PI*2);x.fill();return c;}
function render(target,maxSide,original=false){const w=source.width||source.naturalWidth,h=source.height||source.naturalHeight;const scale=Math.min(1,maxSide/Math.max(w,h));target.width=Math.max(1,Math.round(w*scale));target.height=Math.max(1,Math.round(h*scale));const c=target.getContext('2d');c.fillStyle='white';c.fillRect(0,0,target.width,target.height);c.drawImage(source,0,0,target.width,target.height);if(original)return;const W=target.width,H=target.height,v=values(),data=c.getImageData(0,0,W,H),p=data.data,tones=new Float32Array(W*H),paper=presets[preset].paper,mix=v.tint/100,contrast=1+v.contrast/100;
for(let i=0,j=0;i<p.length;i+=4,j++){let rgb=[p[i],p[i+1],p[i+2]].map(z=>Math.max(0,Math.min(255,(z-128)*contrast+128+v.brightness*2)));const lum=rgb[0]*.2126+rgb[1]*.7152+rgb[2]*.0722;tones[j]=1-lum/255;for(let k=0;k<3;k++){let val=rgb[k];if(preset==='mono')val=lum;p[i+k]=val*(1-mix)+paper[k]*mix;}p[i+3]=255;}c.putImageData(data,0,0);
const spacing=v.size* Math.max(W,H)/1200,theta=v.angle*Math.PI/180,co=Math.cos(theta),si=Math.sin(theta),reach=Math.hypot(W,H)/2+spacing*2;c.fillStyle=$('ink').value;c.globalAlpha=v.strength/100;for(let gy=-reach;gy<=reach;gy+=spacing){c.beginPath();for(let gx=-reach;gx<=reach;gx+=spacing){const x=W/2+gx*co-gy*si,y=H/2+gx*si+gy*co;if(x<0||y<0||x>=W||y>=H)continue;const t=tones[Math.floor(y)*W+Math.floor(x)],r=spacing*.76*Math.sqrt(Math.max(0,t));if(r<.07)continue;c.moveTo(x+r,y);c.arc(x,y,r,0,Math.PI*2);}c.fill();}c.globalAlpha=1;}
function preview(){labels();render(canvas,1100,comparing);const w=source.width||source.naturalWidth,h=source.height||source.naturalHeight;const s=Math.min(1,4096/Math.max(w,h));$('dimensions').textContent=Math.round(w*s)+' × '+Math.round(h*s);}
function schedule(){labels();clearTimeout(timer);timer=setTimeout(preview,45);}
function setPreset(name){preset=name;$('ink').value=presets[name].ink;document.querySelectorAll('[data-preset]').forEach(b=>b.classList.toggle('active',b.dataset.preset===name));schedule();}
async function load(file){if(!file)return;const version=++uploadVersion;if(file.size>40*1024*1024){message('40MB 이하의 이미지를 선택해 주세요.',true);return;}message('사진을 불러오는 중…');const url=URL.createObjectURL(file);try{const img=new Image();img.src=url;await img.decode();if(version!==uploadVersion)return;source=img;sample=false;fileName=file.name.replace(/\.[^.]+$/,'');$('filename').textContent=file.name.length>35?file.name.slice(0,32)+'…':file.name;$('badge').textContent='LIVE PREVIEW';preview();message('변환 완료 · 설정을 조절해 보세요.');}catch(e){if(version===uploadVersion)message('이 이미지를 열 수 없어요. JPG, PNG 또는 WebP로 시도해 주세요.',true);}finally{URL.revokeObjectURL(url);$('file').value='';}}
$('upload').onclick=()=>$('file').click();$('file').onchange=e=>load(e.target.files[0]);for(const id of [...ids,'ink'])$(id).oninput=schedule;document.querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>setPreset(b.dataset.preset));$('reset').onclick=()=>{for(const id of ids)$(id).value=defaults[id];setPreset('lavender');message('기본 설정으로 돌아왔어요.');};
const stage=$('stage');for(const type of ['dragenter','dragover'])stage.addEventListener(type,e=>{e.preventDefault();stage.classList.add('drag');});stage.addEventListener('dragleave',()=>stage.classList.remove('drag'));stage.addEventListener('drop',e=>{e.preventDefault();stage.classList.remove('drag');load(e.dataTransfer.files[0]);});
function compare(on){if(comparing===on)return;comparing=on;preview();$('badge').textContent=on?'ORIGINAL':'LIVE PREVIEW';}const cmp=$('compare');cmp.onpointerdown=e=>{cmp.setPointerCapture(e.pointerId);compare(true);};for(const type of ['pointerup','pointercancel','lostpointercapture'])cmp.addEventListener(type,()=>compare(false));cmp.onkeydown=e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();compare(true);}};cmp.onkeyup=e=>{if(e.key===' '||e.key==='Enter')compare(false);};cmp.onblur=()=>compare(false);
$('save').onclick=async()=>{const button=$('save');button.disabled=true;message('이미지를 만드는 중…');try{await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));const out=document.createElement('canvas');render(out,4096);const format=$('format').value,blob=await new Promise(r=>out.toBlob(r,'image/'+format,.96));if(!blob)throw Error('encode');const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=fileName+'-halftone.'+(format==='jpeg'?'jpg':'png');document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);message('저장할 이미지가 준비됐어요.');}catch(e){message('저장에 실패했어요. 다른 사진이나 형식으로 다시 시도해 주세요.',true);}finally{button.disabled=false;}};
source=sampleImage();preview();

</script></body></html>
